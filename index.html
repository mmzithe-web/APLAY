<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>APLAY</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='none' stroke='%238b0000' stroke-width='4'/%3E%3Cpath d='M32 6V58M6.3 36H57.7M32 6L57.7 36' fill='none' stroke='%238b0000' stroke-width='4'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem("aplay_theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff;--tx:#000;--mut:#6b4a4a;--ac:#8b0000}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--tx:#fff;--mut:#a8a8a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.hide{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib svg{width:22px;height:22px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;position:relative;z-index:25}
.ring,.aa{stroke:var(--ac)}
#auth{align-items:center;justify-content:center;padding:24px}
#auth .logo{width:84px;height:84px;overflow:visible;margin-bottom:26px;transition:width .9s ease,height .9s ease,margin .9s ease}
#auth.intro .logo{width:min(46vw,190px);height:min(46vw,190px);margin-bottom:0}
#f{width:100%;max-width:340px;max-height:460px;transition:opacity .8s ease .3s,max-height .9s ease}
#auth.intro #f{opacity:0;max-height:0;overflow:hidden;pointer-events:none}
.line{width:100%;background:none;border:0;border-bottom:1px solid var(--ac);color:inherit;font:inherit;font-size:16px;padding:13px 4px;margin:6px 0;outline:none;border-radius:0}
.row2{display:flex;gap:10px;margin-top:22px}
.btn{flex:1;border:1px solid var(--ac);border-radius:12px;padding:12px}
.btn.f{background:var(--ac);color:#fff}
.or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:18px 0 14px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--ac)}
.gb{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--ac);border-radius:12px;padding:12px}
.gb svg{width:20px;height:20px}
#err,#pmsg{color:var(--mut);font-size:14px;min-height:20px;margin:12px 0 0;text-align:center}
#stage{flex:1;overflow-y:auto;padding:0 18px 12px;display:flex;flex-direction:column}
body.playing #stage{padding-bottom:110px}
#q{margin:auto;font-size:110px;font-weight:200;color:var(--ac);line-height:1}
#cap{color:var(--mut);margin:6px 0 14px;font-size:14px;line-height:1.7}
.row{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--ac);cursor:pointer}
.row:last-child{border-bottom:1px solid var(--ac)}
.cv{width:56px;height:56px;border-radius:6px;background:center/cover;border:1px solid var(--ac);display:grid;place-items:center;color:var(--ac);flex:none;font-size:22px}
.row b{display:block;font-weight:600}.row small{color:var(--mut)}
.row.on b{color:var(--ac)}
#dock{padding:10px 14px 14px}
#box{display:flex;align-items:center;border:1.5px solid var(--ac);border-radius:14px;padding:3px 4px 3px 16px}
#msg{flex:1;min-width:0;background:none;border:0;color:inherit;font:inherit;font-size:16px;padding:10px 0;outline:none}
body.playing #dock{display:none}
#bar{position:fixed;top:0;right:0;bottom:0;width:68px;z-index:20;background:var(--bg);border-left:1px solid var(--ac);display:flex;flex-direction:column;align-items:center;gap:18px;padding:calc(env(safe-area-inset-top) + 70px) 0 20px}
.av,.pro{width:40px;height:40px;border:1.5px solid var(--ac);border-radius:50%;background:center/cover;display:grid;place-items:center;overflow:hidden;color:var(--ac)}
.av svg{width:22px;height:22px;color:var(--tx)}
.pro{font-size:12px;font-weight:700}
#player{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--ac);padding:8px 14px calc(8px + env(safe-area-inset-bottom))}
body.playing #player{display:block}
#pt{text-align:center;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:center;justify-content:space-between}
.ctl{display:flex;align-items:center;gap:6px}
.ctl .big{width:52px;height:52px;border:1.5px solid var(--ac)}
.ctl .big svg{width:24px;height:24px}
#lk.liked svg{fill:var(--ac);stroke:var(--ac)}
.page{align-items:center;padding-left:24px;padding-right:24px}
.page .top{width:100%;padding-left:0;padding-right:0}
.page .body{width:100%;max-width:380px;flex:1;display:flex;flex-direction:column;align-items:center}
#pav{width:110px;height:110px;border:1.5px solid var(--ac);border-radius:50%;background:center/cover;display:grid;place-items:center;overflow:hidden;margin:18px 0 26px}
#pav svg{width:48px;height:48px}
.lab{align-self:flex-start;color:var(--mut);font-size:12px;margin-top:14px}
#pmail{align-self:flex-start;padding:13px 4px;color:var(--mut);border-bottom:1px solid var(--ac);width:100%}
.act{width:100%;max-width:380px;padding-bottom:18px}
#llist{width:100%;max-width:560px;overflow-y:auto;flex:1}
body.playing #llist{padding-bottom:110px}
.big-pro{width:120px;height:120px;border:1.5px solid var(--ac);border-radius:50%;display:grid;place-items:center;color:var(--ac);font-size:30px;font-weight:700;margin:40px 0 20px}
</style>
</head>
<body>

<section id="auth" class="screen intro" dir="ltr">
  <svg class="logo" viewBox="0 0 64 64" aria-label="APLAY"><circle class="ring" cx="32" cy="32" r="26" fill="none" stroke-width="2"/><path class="aa" d="M32 6V58M6.3 36H57.7M32 6L57.7 36" fill="none" stroke-width="2"/></svg>
  <div id="f">
    <input id="em" class="line" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" class="line" type="password" placeholder="Password" autocomplete="current-password">
    <div class="row2"><button id="login" class="btn f">Log in</button><button id="signup" class="btn">Sign up</button></div>
    <div class="or">or</div>
    <button id="google" class="gb"><svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>Continue with Google</button>
    <p id="err"></p>
  </div>
</section>

<section id="chat" class="screen hide" dir="ltr">
  <div class="top"><span></span><button class="ib" id="menu" data-ic="menu" aria-label="Menu"></button></div>
  <div id="stage">
    <div id="q">?</div>
    <div id="res" class="hide"><p id="cap"></p><div id="list"></div></div>
  </div>
  <div id="dock"><div id="box"><input id="msg" placeholder="Describe your mood, weather, place…" autocomplete="off"><button class="ib" id="send" data-ic="send" aria-label="Send"></button></div></div>
  <nav id="bar" class="hide">
    <button class="av" id="bav" aria-label="Profile"></button>
    <button class="ib" id="blk" data-ic="star" aria-label="Likes"></button>
    <button class="pro" id="bpro">Pro</button>
    <button class="ib" id="bth" aria-label="Theme"></button>
  </nav>
</section>

<section id="profile" class="screen page hide" dir="ltr">
  <div class="top"><button class="ib" data-back data-ic="close" aria-label="Close"></button><span></span></div>
  <div class="body">
    <button id="pav" aria-label="Change photo"></button>
    <input id="pfile" type="file" accept="image/*" class="hide">
    <span class="lab">Name</span><input id="pname" class="line" placeholder="Your name">
    <span class="lab">Email</span><div id="pmail"></div>
    <p id="pmsg"></p>
  </div>
  <div class="act"><button id="psave" class="btn f" style="width:100%">Save</button><button id="plogout" class="btn" style="width:100%;margin-top:10px">Log out</button></div>
</section>

<section id="likes" class="screen page hide" dir="ltr">
  <div class="top"><button class="ib" data-back data-ic="close" aria-label="Close"></button><span></span></div>
  <div id="llist"></div>
</section>

<section id="pro" class="screen page hide" dir="ltr">
  <div class="top"><button class="ib" data-back data-ic="close" aria-label="Close"></button><span></span></div>
  <div class="body">
    <div class="big-pro">Pro</div>
    <p style="color:var(--mut);margin:0 0 22px">Unlimited songs every day.</p>
    <div style="width:100%;border-top:1px solid var(--ac);margin-bottom:22px"></div>
    <button class="btn" style="width:100%;flex:none;opacity:.6;cursor:default">Coming soon</button>
  </div>
</section>

<div id="player">
  <div id="pt"></div>
  <div class="pr">
    <button class="ib" id="lk" data-ic="star" aria-label="Like"></button>
    <div class="ctl"><button class="ib" id="pv" data-ic="prev" aria-label="Previous"></button><button class="ib big" id="pp" aria-label="Play/Pause"></button><button class="ib" id="nx" data-ic="next" aria-label="Next"></button></div>
    <button class="ib" id="cl" data-ic="close" aria-label="Close player"></button>
  </div>
</div>
<audio id="au"></audio>

<script>
// ===== این دو مقدار را از فایل قبلی‌ات کپی کن =====
const SUPABASE_URL = "https://hfxxhsfobtvkcdrcqfrj.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhmeHhoc2ZvYnR2a2NkcmNxZnJqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ3MzM4MjMsImV4cCI6MjExMDMwOTgyM30.Q0hEW9M9d16OdSnT5j3xiWkMbAOlRlm6WqLPpCMo5Dk";
// ==================================================
const $ = id => document.getElementById(id);
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const P = {
  close:'<path d="M6 6l12 12M18 6L6 18"/>', menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
  send:'<path d="M5 12h14M13 6l6 6-6 6"/>', user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',
  prev:'<path d="M19 5v14L9 12zM6 5v14"/>', next:'<path d="M5 5v14l10-7zM18 5v14"/>',
  play:'<path d="M7 4v16l13-8z"/>', pause:'<path d="M8 5v14M16 5v14"/>',
  moon:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
document.querySelectorAll("[data-ic]").forEach(e => e.innerHTML = ic(e.dataset.ic));
let me = null, prof = {}, tracks = [], liked = new Set(), queue = [], qi = -1, hist = [], entered = false;
const au = $("au"), pub = (b, p) => sb.storage.from(b).getPublicUrl(p).data.publicUrl;
const cur = () => queue[qi];

function setTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  $("bth").innerHTML = ic(t === "dark" ? "sun" : "moon");
  try { localStorage.setItem("aplay_theme", t); } catch (e) {}
}
setTheme(document.documentElement.getAttribute("data-theme") || "light");
$("bth").onclick = () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("hide", s.id !== id));
  $("bar").classList.add("hide");
}
document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => show("chat"));
$("menu").onclick = () => $("bar").classList.toggle("hide");
function setAv(el, path) {
  el.style.backgroundImage = path ? `url('${pub("avatars", path)}')` : "";
  el.innerHTML = path ? "" : ic("user");
}

async function auth(kind) {
  $("err").textContent = "";
  const f = kind === "up" ? sb.auth.signUp : sb.auth.signInWithPassword;
  const { data, error } = await f.call(sb.auth, { email: $("em").value.trim(), password: $("pw").value });
  if (error) return $("err").textContent = error.message;
  if (data.session) enter(data.session); else $("err").textContent = "Check your email to confirm, then log in.";
}
$("login").onclick = () => auth("in"); $("signup").onclick = () => auth("up");
$("google").onclick = async () => {
  $("err").textContent = "";
  const { error } = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin } });
  if (error) $("err").textContent = error.message;
};
async function enter(session) {
  if (entered) return; entered = true; me = session.user;
  const [t, l, p] = await Promise.all([
    sb.from("tracks").select("*"),
    sb.from("likes").select("track_id"),
    sb.from("profiles").select("*").eq("id", me.id).maybeSingle()
  ]);
  tracks = t.data || []; liked = new Set((l.data || []).map(x => x.track_id)); prof = p.data || {};
  setAv($("bav"), prof.avatar_path); show("chat");
}

function rows(el, arr) {
  el.innerHTML = "";
  arr.forEach((t, i) => {
    const r = document.createElement("div"); r.className = "row"; r.dataset.id = t.id;
    r.innerHTML = `<div class="cv"${t.cover_path ? ` style="background-image:url('${pub("covers", t.cover_path)}')"` : ""}>${t.cover_path ? "" : "♪"}</div><div><b></b><small></small></div>`;
    r.querySelector("b").textContent = t.title; r.querySelector("small").textContent = t.artist || "";
    r.onclick = () => play(arr, i); el.appendChild(r);
  });
  mark();
}
function mark() { document.querySelectorAll(".row").forEach(r => r.classList.toggle("on", !!cur() && +r.dataset.id === cur().id)); }
function sync() {
  $("pp").innerHTML = ic(au.paused ? "play" : "pause");
  $("lk").classList.toggle("liked", !!cur() && liked.has(cur().id));
}
function play(arr, i) {
  queue = arr; qi = i; const t = cur();
  au.src = pub("music", t.file_path); au.play().catch(() => {});
  document.body.classList.add("playing");
  $("pt").textContent = t.title + (t.artist ? " — " + t.artist : "");
  sync(); mark();
}
function step(d) { const n = qi + d; if (n >= 0 && n < queue.length) play(queue, n); }
au.onplay = au.onpause = sync; au.onended = () => step(1);
$("pp").onclick = () => au.paused ? au.play() : au.pause();
$("pv").onclick = () => step(-1); $("nx").onclick = () => step(1);
$("cl").onclick = () => { au.pause(); au.removeAttribute("src"); document.body.classList.remove("playing"); queue = []; qi = -1; mark(); show("chat"); };
$("lk").onclick = async () => {
  const t = cur(); if (!t) return;
  if (liked.has(t.id)) { liked.delete(t.id); await sb.from("likes").delete().match({ user_id: me.id, track_id: t.id }); }
  else { liked.add(t.id); await sb.from("likes").insert({ user_id: me.id, track_id: t.id }); }
  sync(); if (!$("likes").classList.contains("hide")) openLikes();
};

async function send() {
  const text = $("msg").value.trim(); if (!text) return;
  $("msg").value = ""; $("q").classList.add("hide"); $("res").classList.remove("hide"); $("cap").textContent = "…";
  try {
    const { data: { session } } = await sb.auth.getSession();
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: JSON.stringify({ message: text, history: hist }) });
    const j = await r.json(); $("cap").textContent = j.reply || ""; $("cap").dir = "auto";
    hist.push({ role: "user", text }, { role: "assistant", text: j.reply || "" });
    rows($("list"), (j.ids || []).map(id => tracks.find(t => t.id == id)).filter(Boolean));
  } catch (e) { $("cap").textContent = "Something went wrong."; }
}
$("send").onclick = send; $("msg").addEventListener("keydown", e => { if (e.key === "Enter") send(); });

$("bav").onclick = () => { setAv($("pav"), prof.avatar_path); $("pname").value = prof.name || ""; $("pmail").textContent = me.email; $("pmsg").textContent = ""; show("profile"); };
function openLikes() {
  const arr = tracks.filter(t => liked.has(t.id)); rows($("llist"), arr);
  if (!arr.length) $("llist").innerHTML = '<p style="color:var(--mut);text-align:center;margin-top:40px">No liked songs yet.</p>';
  show("likes");
}
$("blk").onclick = openLikes; $("bpro").onclick = () => show("pro");
$("pav").onclick = () => $("pfile").click();
$("pfile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  const path = `${me.id}/avatar.${(f.name.split(".").pop() || "jpg").toLowerCase()}`;
  const { error } = await sb.storage.from("avatars").upload(path, f, { upsert: true });
  if (error) return $("pmsg").textContent = error.message;
  prof.avatar_path = path; setAv($("pav"), path);
};
$("psave").onclick = async () => {
  prof.name = $("pname").value.trim();
  const { error } = await sb.from("profiles").upsert({ id: me.id, name: prof.name, avatar_path: prof.avatar_path || null });
  $("pmsg").textContent = error ? error.message : "Saved ✓"; setAv($("bav"), prof.avatar_path);
};
$("plogout").onclick = async () => { await sb.auth.signOut(); location.reload(); };

setTimeout(() => $("auth").classList.remove("intro"), 1500);
sb.auth.getSession().then(({ data }) => { if (data.session) enter(data.session); });
</script>
</body>
</html>
